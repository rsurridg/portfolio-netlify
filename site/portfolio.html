<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Merakiae Art</title>
  <link rel="icon" href="favicon.svg" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cutive+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/portfolio.css" />
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="portfolio.html" style="font-weight:700;">Portfolio</a>
    <a href="resume.html">Résumé</a>
    <a class="nav-logo" href="index.html">
      <img src="logo.png" alt="Merakiae Art" />
    </a>
    <a href="https://www.etsy.com/shop/MerakiaeArt" target="_blank" rel="noopener">Shop Prints</a>
    <a href="work-with-me.html">Work With Me</a>
  </nav>

  <div class="page">
    <p class="page-label">Portfolio</p>

    <!-- Filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="traditional">Traditional Art</button>
      <button class="filter-btn" data-filter="digital">Digital Art</button>
      <button class="filter-btn" data-filter="photography">Photography</button>
      <button class="filter-btn" data-filter="writing">Writing</button>
      <button class="filter-btn" data-filter="code">Code</button>
    </div>

    <!-- Work grid — populated by js/portfolio.js -->
    <div class="bento" id="work-grid"></div>
  </div>

  <footer>
    <div class="footer-inner">
      <p>© <span id="yr"></span> Merakiae Art</p>
      <p>Soli Deo Gloria</p>
      <div class="footer-links">
        <a href="https://instagram.com/merakiae.art" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:merakiae.art@gmail.com">Email</a>
      </div>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" src="" alt="" />
    <div class="lightbox-caption">
      <div class="lightbox-title" id="lightbox-title"></div>
      <div class="lightbox-meta" id="lightbox-meta"></div>
    </div>
  </div>

  <script src="js/portfolio.js"></script>
</body>
</html>
